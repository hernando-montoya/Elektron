name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. QUALITY, VALIDATION & LINT
  # =========================================================================
  validate-and-lint:
    name: 🛡️ Code Quality & Gradle Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile Kotlin WasmJS & Verify Dependencies
        run: ./gradlew compileKotlinWasmJs --stacktrace

  # =========================================================================
  # 2. AUTOMATED UNIT TESTING & DOMAIN VERIFICATION
  # =========================================================================
  test:
    name: 🧪 Automated Test Suite (WasmJS / NF C 15-100)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-and-lint]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Domain & Topological Unit Tests
        run: ./gradlew wasmJsTest --stacktrace

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasmJs-test-report
          path: build/reports/tests/
          retention-days: 14

  # =========================================================================
  # 3. SECURITY SCANNING
  # =========================================================================
  security-audit:
    name: 🔒 Security & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Full History for Secret Detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 4. BUILD PRODUCTION ARTIFACT & BUNDLE BUDGET
  # =========================================================================
  build-distribution:
    name: 📦 Build WasmJS Web App & Verify Budget
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Browser Production Distribution
        run: ./gradlew wasmJsBrowserDistribution --stacktrace

      - name: Audit Bundle Size & Generate Metrics
        run: |
          DIST_DIR="build/dist/wasmJs/productionExecutable"
          echo "### 📊 Production Bundle Size Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "$DIST_DIR" ]; then
            for f in "$DIST_DIR"/*; do
              if [ -f "$f" ]; then
                fname=$(basename "$f")
                fsize=$(ls -lh "$f" | awk '{print $5}')
                echo "| \`$fname\` | **$fsize** |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

      - name: Upload Web Application Distribution
        uses: actions/upload-artifact@v4
        with:
          name: elektron-web-dist
          path: build/dist/wasmJs/productionExecutable/
          retention-days: 30

  # =========================================================================
  # 5. CONTINUOUS DEPLOYMENT (GITHUB PAGES)
  # =========================================================================
  deploy-github-pages:
    name: 🚀 Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-distribution, security-audit]
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Production Web Distribution
        uses: actions/download-artifact@v4
        with:
          name: elektron-web-dist
          path: dist

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
